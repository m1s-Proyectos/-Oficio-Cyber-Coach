<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Un paso más para continuar</title><desc id="desc">Escenario educativo ficticio sobre captcha / clickfix.</desc><rect width="1200" height="680" rx="28" fill="#f4f8f5"/><circle cx="160" cy="110" r="150" fill="#dff2e7" opacity=".65"/><circle cx="1060" cy="590" r="180" fill="#e5edf6" opacity=".7"/><rect x="42" y="38" width="1116" height="604" rx="24" fill="#ffffff" stroke="#dfe8e1" stroke-width="2"/><rect x="42" y="38" width="1116" height="72" rx="24" fill="#ffffff"/><path d="M42 86h1116v24H42z" fill="#ffffff"/><rect x="72" y="59" width="32" height="32" rx="10" fill="#c94b43"/><text x="88" y="81" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">!</text><text x="120" y="73" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243a31">NoCaigas · Entrenamiento seguro</text><text x="1124" y="73" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#c94b43">SIMULACIÓN EDUCATIVA</text><g transform="translate(-180 -40) scale(1.3 1.15)"><rect x="330" y="170" width="540" height="360" rx="18" fill="#ffffff" stroke="#d9e3dc" stroke-width="2"/><rect x="330" y="170" width="540" height="48" rx="18" fill="#eef3ef"/><path d="M330 200h540v18H330z" fill="#eef3ef"/><circle cx="356" cy="194" r="6" fill="#e77b72"/><circle cx="376" cy="194" r="6" fill="#e8bf5b"/><circle cx="396" cy="194" r="6" fill="#68bd91"/><rect x="430" y="182" width="330" height="24" rx="12" fill="#ffffff" stroke="#d8e0db"/><text x="595" y="198" text-anchor="middle" font-size="12" fill="#64746b">example-verification.test</text><rect x="370" y="245" width="460" height="68" rx="12" fill="#e8f5ee"/><text x="400" y="272" font-size="18" font-weight="700" fill="#1b6048">◈  Verificación requerida</text><text x="400" y="288" font-size="12" fill="#49665a">Para completar la verificación, copia una instrucción</text><text x="400" y="305" font-size="12" fill="#49665a">y pégala en la ventana de comandos de tu equipo.</text><rect x="370" y="332" width="460" height="66" rx="10" fill="#fff0ee" stroke="#d88b83" stroke-dasharray="5 5"/><text x="392" y="357" font-size="13" font-weight="700" fill="#883d36">›  Instrucción de terminal oculta</text><text x="392" y="379" font-size="12" fill="#883d36">No copies ni ejecutes instrucciones desconocidas.</text><rect x="370" y="416" width="460" height="76" rx="10" fill="#fde8e6"/><text x="392" y="444" font-size="14" font-weight="700" fill="#9d3f38">⚠  ESTA PETICIÓN ES SOSPECHOSA</text><text x="392" y="467" font-size="12" fill="#8a4a45">Un CAPTCHA normal no necesita que ejecutes comandos.</text></g><text x="600" y="608" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#718078">Ejemplo ficticio · No interactúa con servicios reales</text></svg>